name: Build blog

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
    - cron: '20 2 * * *'
    - cron: '20 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Optional digest date in YYYY-MM-DD format
        required: false
        type: string
      dry-run:
        description: Validate collection and generation without writing the digest
        required: false
        default: false
        type: boolean

concurrency:
  group: build-blog-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch AI HOT daily
        if: ${{ inputs['dry-run'] != true }}
        id: aihot
        run: |
          set +e
          python3 src/aihot.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ] || [ "$code" -gt 2 ]; then
            exit "$code"
          fi
          exit 0
      - name: Generate open source radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RADAR_DATE: ${{ inputs.date || '' }}
          RADAR_DRY_RUN: ${{ inputs['dry-run'] || false }}
        run: |
          args=()
          if [ -n "$RADAR_DATE" ]; then
            if ! [[ "$RADAR_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid radar date; expected YYYY-MM-DD" >&2
              exit 2
            fi
            args+=(--date "$RADAR_DATE")
          fi
          if [ "$RADAR_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 src/opensource.py "${args[@]}"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate site
        run: python3 src/generator.py
      - name: Commit & push
        if: ${{ inputs['dry-run'] != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "build: $(TZ=Asia/Shanghai date +%F)" || echo "no changes"
          git push
